name: Evaluate Signals

# Daily run: 21:30 UTC Mon–Fri, after the US close in both EDT (20:00 UTC)
# and EST (21:00 UTC). Fridays run the same daily job, then the weekly summary.
# Can also be triggered manually from the Actions tab.
#
# **DESIGN DECISION — run after the close, never during a session.**
# This job downloads signal_log.csv from PythonAnywhere, edits it, and uploads
# the whole file back. It used to run at 15:10 UTC, while live_trader.py (15:00
# UTC) was still appending rows: exits were logged as late as 17:16 UTC. Any
# row written between the download and the upload was silently overwritten.
# After the close, market_is_open() makes the trader exit before writing
# anything, so the log cannot change underneath this job.
#
# It also fixes outcome scoring: yfinance's bar for *today* is intraday until
# the close, so rows due today were being scored against a mid-session price.
#
# Two further guards, because a schedule is not a lock:
#   - concurrency: one run at a time. The old Friday pair of crons started two
#     copies that downloaded and uploaded the log at the same time.
#   - the upload re-reads the file on PA and refuses to overwrite it if it
#     changed since the download (optimistic concurrency).
on:
  schedule:
    - cron: '30 21 * * 1-4'   # daily evaluation Mon–Thu
    - cron: '30 21 * * 5'     # Friday: daily evaluation, then weekly summary
  workflow_dispatch:

concurrency:
  group: signal-log-sync
  cancel-in-progress: false

jobs:
  evaluate-signals:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ------------------------------------------------------------------
      # Download signal_log.csv from PythonAnywhere.
      # Sets output has_data=true  → file exists, proceed to evaluate.
      # Sets output has_data=false → 404 (first run), create empty file
      #                              with headers and exit gracefully.
      # ------------------------------------------------------------------
      - name: Download signal_log.csv from PythonAnywhere
        id: download
        env:
          PYTHONANYWHERE_TOKEN: ${{ secrets.PYTHONANYWHERE_TOKEN }}
          PYTHONANYWHERE_USERNAME: ${{ secrets.PYTHONANYWHERE_USERNAME }}
        run: |
          python - <<'PYEOF'
          import csv
          import hashlib
          import os
          import sys

          import requests

          token    = os.environ["PYTHONANYWHERE_TOKEN"]
          username = os.environ["PYTHONANYWHERE_USERNAME"]
          remote   = f"/home/{username}/finance_bot/data/signal_log.csv"
          local    = os.path.join("data", "signal_log.csv")

          os.makedirs("data", exist_ok=True)

          url  = f"https://www.pythonanywhere.com/api/v0/user/{username}/files/path{remote}"
          resp = requests.get(
              url,
              headers={"Authorization": f"Token {token}"},
              timeout=30,
          )

          if resp.status_code == 404:
              print("[INFO] signal_log.csv not found on PythonAnywhere.")
              print("[INFO] Creating empty file with headers — nothing to evaluate yet.")
              fieldnames = [
                  "date", "ticker", "model_signal", "price", "qty", "confidence",
                  "evaluation_date", "actual_action", "outcome_price", "result",
              ]
              with open(local, "w", newline="") as fh:
                  csv.DictWriter(fh, fieldnames=fieldnames).writeheader()
              with open(os.environ["GITHUB_OUTPUT"], "a") as gh:
                  gh.write("has_data=false\n")
              print("[INFO] Exiting gracefully.")
              sys.exit(0)

          resp.raise_for_status()

          with open(local, "wb") as fh:
              fh.write(resp.content)

          # Fingerprint of the file as downloaded. The upload step compares
          # PA's current copy against it before overwriting.
          digest = hashlib.sha256(resp.content).hexdigest()
          print(f"[OK] Downloaded signal_log.csv ({len(resp.content):,} bytes, sha256 {digest[:12]})")
          with open(os.environ["GITHUB_OUTPUT"], "a") as gh:
              gh.write("has_data=true\n")
              gh.write(f"sha256={digest}\n")
          PYEOF

      # ------------------------------------------------------------------
      # Run outcome_tracker.py on the GitHub VM.
      # Reads data/signal_log.csv (just downloaded), fills outcome_price
      # and result for all ready rows, writes the updated file back in place.
      # Skipped when has_data=false (no rows exist yet).
      # ------------------------------------------------------------------
      - name: Evaluate signal outcomes
        if: steps.download.outputs.has_data == 'true'
        run: python outcome_tracker.py

      # ------------------------------------------------------------------
      # Recover stop-loss exits Alpaca filled outside a bot session. Standing
      # OTO stops fire between runs and never reach log_exit(), so without
      # this the losing tail is simply absent from realized P&L.
      #
      # Runs here, before the log is uploaded back to PythonAnywhere, so the
      # recovered EXIT rows persist. Idempotent — keyed on Alpaca's filled_at,
      # so a re-run writes nothing.
      # ------------------------------------------------------------------
      - name: Reconcile stop-loss fills
        if: steps.download.outputs.has_data == 'true'
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python reconcile_stops.py --discord

      # ------------------------------------------------------------------
      # POST the updated signal_log.csv back to PythonAnywhere so
      # live_trader.py always reads the latest evaluated log.
      # Skipped when has_data=false (nothing was changed).
      # ------------------------------------------------------------------
      - name: Upload updated signal_log.csv to PythonAnywhere
        if: steps.download.outputs.has_data == 'true'
        env:
          PYTHONANYWHERE_TOKEN: ${{ secrets.PYTHONANYWHERE_TOKEN }}
          PYTHONANYWHERE_USERNAME: ${{ secrets.PYTHONANYWHERE_USERNAME }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DOWNLOADED_SHA256: ${{ steps.download.outputs.sha256 }}
        run: |
          python - <<'PYEOF'
          import hashlib
          import os
          import sys

          import requests

          token    = os.environ["PYTHONANYWHERE_TOKEN"]
          username = os.environ["PYTHONANYWHERE_USERNAME"]
          remote   = f"/home/{username}/finance_bot/data/signal_log.csv"
          local    = os.path.join("data", "signal_log.csv")

          url = f"https://www.pythonanywhere.com/api/v0/user/{username}/files/path{remote}"
          headers = {"Authorization": f"Token {token}"}

          # Refuse to overwrite rows written on PA since the download. The
          # upload replaces the whole file, so anything appended meanwhile
          # would be lost. Failing leaves PA's copy intact; the next run
          # redoes this run's outcome scoring and stop reconciliation.
          try:
              current = requests.get(url, headers=headers, timeout=30)
              current.raise_for_status()
          except requests.exceptions.RequestException as exc:
              print(f"[ERROR] Could not re-read PA copy before upload: {exc}")
              sys.exit(1)

          if hashlib.sha256(current.content).hexdigest() != os.environ["DOWNLOADED_SHA256"]:
              msg = (
                  "signal_log.csv changed on PythonAnywhere while evaluate_signals.yml "
                  "was running. Upload skipped so no rows are overwritten; "
                  "the next run will redo this evaluation."
              )
              print(f"[ERROR] {msg}")
              hook = os.environ.get("DISCORD_WEBHOOK_URL")
              if hook:
                  try:
                      requests.post(hook, json={"content": f"**Log sync skipped** - {msg}"}, timeout=10)
                  except requests.exceptions.RequestException:
                      pass
              sys.exit(1)

          try:
              with open(local, "rb") as fh:
                  resp = requests.post(
                      url,
                      headers=headers,
                      files={"content": fh},
                      timeout=60,
                  )
          except requests.exceptions.RequestException as exc:
              print(f"[ERROR] Upload request failed: {exc}")
              sys.exit(1)

          if resp.status_code in (200, 201):
              print(f"[OK] Uploaded signal_log.csv → {remote}")
          else:
              print(f"[ERROR] Upload failed — HTTP {resp.status_code}: {resp.text.strip()}")
              sys.exit(1)
          PYEOF

  # ============================================================
  # Weekly summary — Fridays only, after the daily evaluation
  # Runs after evaluate-signals completes. Posts win rate and
  # rate of return vs SPY to Discord.
  # ============================================================
  weekly-summary:
    needs: evaluate-signals
    runs-on: ubuntu-latest
    if: github.event.schedule == '30 21 * * 5' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Download the latest signal_log.csv (already evaluated by the daily job)
      - name: Download signal_log.csv from PythonAnywhere
        id: download
        env:
          PYTHONANYWHERE_TOKEN: ${{ secrets.PYTHONANYWHERE_TOKEN }}
          PYTHONANYWHERE_USERNAME: ${{ secrets.PYTHONANYWHERE_USERNAME }}
        run: |
          python - <<'PYEOF'
          import csv
          import os
          import sys

          import requests

          token    = os.environ["PYTHONANYWHERE_TOKEN"]
          username = os.environ["PYTHONANYWHERE_USERNAME"]
          remote   = f"/home/{username}/finance_bot/data/signal_log.csv"
          local    = os.path.join("data", "signal_log.csv")

          os.makedirs("data", exist_ok=True)

          url  = f"https://www.pythonanywhere.com/api/v0/user/{username}/files/path{remote}"
          resp = requests.get(
              url,
              headers={"Authorization": f"Token {token}"},
              timeout=30,
          )

          if resp.status_code == 404:
              print("[INFO] signal_log.csv not found on PythonAnywhere — skipping weekly summary.")
              with open(os.environ["GITHUB_OUTPUT"], "a") as gh:
                  gh.write("has_data=false\n")
              sys.exit(0)

          resp.raise_for_status()

          with open(local, "wb") as fh:
              fh.write(resp.content)

          print(f"[OK] Downloaded signal_log.csv ({len(resp.content):,} bytes)")
          with open(os.environ["GITHUB_OUTPUT"], "a") as gh:
              gh.write("has_data=true\n")
          PYEOF

      # Download SPY.csv so get_spy_start_price() can read it without a yfinance fallback
      - name: Download SPY.csv from PythonAnywhere
        if: steps.download.outputs.has_data == 'true'
        env:
          PYTHONANYWHERE_TOKEN: ${{ secrets.PYTHONANYWHERE_TOKEN }}
          PYTHONANYWHERE_USERNAME: ${{ secrets.PYTHONANYWHERE_USERNAME }}
        run: |
          python - <<'PYEOF'
          import os

          import requests

          token    = os.environ["PYTHONANYWHERE_TOKEN"]
          username = os.environ["PYTHONANYWHERE_USERNAME"]
          remote   = f"/home/{username}/finance_bot/data/market/SPY.csv"
          local    = os.path.join("data", "market", "SPY.csv")

          os.makedirs(os.path.dirname(local), exist_ok=True)

          url  = f"https://www.pythonanywhere.com/api/v0/user/{username}/files/path{remote}"
          resp = requests.get(
              url,
              headers={"Authorization": f"Token {token}"},
              timeout=30,
          )

          if resp.status_code == 404:
              print("[WARN] SPY.csv not found on PythonAnywhere — will fall back to yfinance.")
          else:
              resp.raise_for_status()
              with open(local, "wb") as fh:
                  fh.write(resp.content)
              print(f"[OK] Downloaded SPY.csv ({len(resp.content):,} bytes)")
          PYEOF

      - name: Post weekly summary to Discord
        if: steps.download.outputs.has_data == 'true'
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python outcome_tracker.py --weekly

      # ------------------------------------------------------------------
      # Realized P&L attribution — reads the same signal_log.csv downloaded
      # above, so no extra fetch. Runs beside the weekly summary because the
      # two answer different questions: outcome_tracker reports win rate and
      # portfolio-vs-SPY, this reports which exit reason actually made or
      # lost the money. A high win rate with a negative expectancy is only
      # visible here.
      # ------------------------------------------------------------------
      - name: Post realized P&L attribution to Discord
        if: steps.download.outputs.has_data == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python pnl_report.py --discord

      # ------------------------------------------------------------------
      # Post-trade analysis agent — LLM-powered pattern detection over
      # the last 30 days of evaluated signals. Correlates SHAP feature
      # drivers with WIN/LOSS outcomes to surface toxic combos, ticker
      # underperformance, and confidence miscalibration. Read-only: it
      # posts findings to Discord but never modifies any data.
      #
      # Reads the same signal_log.csv already downloaded above. Needs
      # GROQ_API_KEY for the LLM call (same as the pre-trade agent).
      # ------------------------------------------------------------------
      - name: Run post-trade analysis agent
        if: steps.download.outputs.has_data == 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python agent_posttrade.py --discord

      # ------------------------------------------------------------------
      # Live performance vs buy-and-hold. Every other return figure in this
      # project is simulated; this one is the account's own equity curve
      # against holding the same basket over the same dates.
      #
      # Deliberately NOT gated on has_data: it reads Alpaca, not
      # signal_log.csv, so it still answers the question on a week when the
      # PythonAnywhere download failed.
      #
      # --fetch because nothing under data/ is tracked in git, so the runner
      # has no price CSVs to build the basket arm from.
      # ------------------------------------------------------------------
      - name: Post live-vs-buy-and-hold to Discord
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python live_benchmark.py --days 180 --fetch --discord

      # ------------------------------------------------------------------
      # Edge degradation monitor — runs in the same weekly slot as the
      # summary so we get one cadence for retrain-trigger decisions.
      # Reads the signal_log.csv already downloaded above; reads/writes
      # data/edge_monitor_state.json to PA so transition tracking
      # survives across runner instances.
      # ------------------------------------------------------------------
      - name: Download edge_monitor_state.json from PythonAnywhere
        if: steps.download.outputs.has_data == 'true'
        env:
          PYTHONANYWHERE_TOKEN: ${{ secrets.PYTHONANYWHERE_TOKEN }}
          PYTHONANYWHERE_USERNAME: ${{ secrets.PYTHONANYWHERE_USERNAME }}
        run: |
          python - <<'PYEOF'
          import os

          import requests

          token    = os.environ["PYTHONANYWHERE_TOKEN"]
          username = os.environ["PYTHONANYWHERE_USERNAME"]
          remote   = f"/home/{username}/finance_bot/data/edge_monitor_state.json"
          local    = os.path.join("data", "edge_monitor_state.json")

          os.makedirs("data", exist_ok=True)

          url  = f"https://www.pythonanywhere.com/api/v0/user/{username}/files/path{remote}"
          resp = requests.get(
              url,
              headers={"Authorization": f"Token {token}"},
              timeout=30,
          )

          if resp.status_code == 404:
              print("[INFO] edge_monitor_state.json not found on PythonAnywhere — first run.")
          else:
              resp.raise_for_status()
              with open(local, "wb") as fh:
                  fh.write(resp.content)
              print(f"[OK] Downloaded edge_monitor_state.json ({len(resp.content):,} bytes)")
          PYEOF

      - name: Run edge monitor
        if: steps.download.outputs.has_data == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python edge_monitor.py

      - name: Upload edge_monitor_state.json to PythonAnywhere
        if: steps.download.outputs.has_data == 'true'
        env:
          PYTHONANYWHERE_TOKEN: ${{ secrets.PYTHONANYWHERE_TOKEN }}
          PYTHONANYWHERE_USERNAME: ${{ secrets.PYTHONANYWHERE_USERNAME }}
        run: |
          python - <<'PYEOF'
          import os
          import sys

          import requests

          token    = os.environ["PYTHONANYWHERE_TOKEN"]
          username = os.environ["PYTHONANYWHERE_USERNAME"]
          remote   = f"/home/{username}/finance_bot/data/edge_monitor_state.json"
          local    = os.path.join("data", "edge_monitor_state.json")

          if not os.path.exists(local):
              print("[WARN] edge_monitor_state.json not found locally — nothing to upload.")
              sys.exit(0)

          url = f"https://www.pythonanywhere.com/api/v0/user/{username}/files/path{remote}"

          try:
              with open(local, "rb") as fh:
                  resp = requests.post(
                      url,
                      headers={"Authorization": f"Token {token}"},
                      files={"content": fh},
                      timeout=60,
                  )
          except requests.exceptions.RequestException as exc:
              print(f"[ERROR] Upload request failed: {exc}")
              sys.exit(1)

          if resp.status_code in (200, 201):
              print(f"[OK] Uploaded edge_monitor_state.json → {remote}")
          else:
              print(f"[ERROR] Upload failed — HTTP {resp.status_code}: {resp.text.strip()}")
              sys.exit(1)
          PYEOF
