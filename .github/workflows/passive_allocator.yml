name: Passive Allocator

# Started at 16:00 UTC Mon–Fri by a PythonAnywhere scheduled task running
# dispatch_workflow.py (see create_pa_dispatch_tasks.py) — inside market hours
# in both EDT and EST. Trades its own paper account (PASSIVE_ALPACA_* secrets),
# never the model bot's. The secret PASSIVE_ALPACA_API_SECRET is passed in
# as PASSIVE_ALPACA_SECRET_KEY, the name the code reads. Discord messages go
# to PASSIVE_DISCORD_WEBHOOK_URL, its own channel, falling back to the model
# bot's DISCORD_WEBHOOK_URL if that secret is missing — so a misnamed secret
# moves the alerts to the main channel rather than silently dropping them.
#
# The runner is fresh each time, so passive_allocator.py keeps its run guard
# at the broker: any order the account placed since midnight UTC stops a
# second run that day. A file would not survive the runner, and without a
# guard a second run would re-buy a deposit whose first buys are still open
# (open orders show in neither positions nor cash). The concurrency group
# stops two runs overlapping mid-trade.
# Can also be triggered manually from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      discord_test:
        description: "Send a Discord test message and skip the allocator"
        type: boolean
        default: false

concurrency:
  group: passive-allocator
  cancel-in-progress: false

jobs:
  allocate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        # The allocator's four packages only — see requirements-passive.txt.
        run: pip install -r requirements-passive.txt

      - name: Send Discord test message
        if: inputs.discord_test
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.PASSIVE_DISCORD_WEBHOOK_URL || secrets.DISCORD_WEBHOOK_URL }}
          WHICH: ${{ secrets.PASSIVE_DISCORD_WEBHOOK_URL && 'PASSIVE_DISCORD_WEBHOOK_URL' || 'DISCORD_WEBHOOK_URL (fallback — passive secret not found)' }}
        run: |
          echo "Posting via $WHICH"
          # Posts directly, not via run_bot.send_discord, which swallows
          # errors: a bad or empty webhook must turn this run red.
          python - <<'PY'
          import os, requests
          url = os.environ["DISCORD_WEBHOOK_URL"]
          if not url:
              raise SystemExit("No Discord webhook secret is set.")
          r = requests.post(url, timeout=10, json={"content":
              f"✅ [passive] Discord test message — sent via {os.environ['WHICH']}."})
          r.raise_for_status()
          print(f"Discord answered HTTP {r.status_code}")
          PY

      - name: Run passive allocator
        if: ${{ !inputs.discord_test }}
        env:
          PASSIVE_ALPACA_API_KEY: ${{ secrets.PASSIVE_ALPACA_API_KEY }}
          PASSIVE_ALPACA_SECRET_KEY: ${{ secrets.PASSIVE_ALPACA_API_SECRET }}
          DISCORD_WEBHOOK_URL: ${{ secrets.PASSIVE_DISCORD_WEBHOOK_URL || secrets.DISCORD_WEBHOOK_URL }}
        run: python passive_allocator.py

      - name: Keep the order log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: passive-log-${{ github.run_id }}
          path: data/passive_log.csv
          if-no-files-found: ignore
          retention-days: 90

      - name: Notify Discord on failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.PASSIVE_DISCORD_WEBHOOK_URL || secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -H "Content-Type: application/json" \
               -X POST \
               -d "{\"content\": \"🚨 **PASSIVE ALLOCATOR FAILED**\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\nTimestamp: $(date -u)\"}" \
               "$DISCORD_WEBHOOK_URL"
