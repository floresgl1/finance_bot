name: Daily Agent Run

# Daily run at 20:30 UTC. Manual dispatch supported for re-runs.
# signal_log.csv lives on PythonAnywhere as the source of truth;
# the runner downloads it at start, uploads agent_runs/*.json to PA at end.
on:
  schedule:
    - cron: '30 20 * * *'
  workflow_dispatch:

# Concurrency group prevents two simultaneous runs from racing on PA uploads.
concurrency:
  group: agent-daily
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ------------------------------------------------------------------
      # Download signal_log.csv from PythonAnywhere.
      # If 404 (PA file missing — pathological), exit gracefully without
      # running the agent. The agent's input is required.
      # ------------------------------------------------------------------
      - name: Download signal_log.csv from PythonAnywhere
        id: download_signal_log
        env:
          PYTHONANYWHERE_TOKEN: ${{ secrets.PYTHONANYWHERE_TOKEN }}
          PYTHONANYWHERE_USERNAME: ${{ secrets.PYTHONANYWHERE_USERNAME }}
        run: |
          python - <<'PYEOF'
          import os
          import sys

          import requests

          token    = os.environ["PYTHONANYWHERE_TOKEN"]
          username = os.environ["PYTHONANYWHERE_USERNAME"]
          remote   = f"/home/{username}/finance_bot/data/signal_log.csv"
          local    = os.path.join("data", "signal_log.csv")

          os.makedirs("data", exist_ok=True)

          url  = f"https://www.pythonanywhere.com/api/v0/user/{username}/files/path{remote}"
          resp = requests.get(
              url,
              headers={"Authorization": f"Token {token}"},
              timeout=30,
          )

          if resp.status_code == 404:
              print("[ERROR] signal_log.csv not found on PythonAnywhere.")
              print("[ERROR] Cannot run agent without input data — exiting.")
              with open(os.environ["GITHUB_OUTPUT"], "a") as gh:
                  gh.write("has_data=false\n")
              sys.exit(1)

          resp.raise_for_status()

          with open(local, "wb") as fh:
              fh.write(resp.content)

          print(f"[OK] Downloaded signal_log.csv ({len(resp.content):,} bytes)")
          with open(os.environ["GITHUB_OUTPUT"], "a") as gh:
              gh.write("has_data=true\n")
          PYEOF

      # ------------------------------------------------------------------
      # Run the agent. continue-on-error so the upload step still runs
      # and pushes the catastrophic-failure envelope to PA on failure.
      # ------------------------------------------------------------------
      - name: Run agent
        id: agent_run
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python agent_main.py

      # ------------------------------------------------------------------
      # Upload the new agent run JSON to PythonAnywhere.
      # `if: always()` so catastrophic-failure envelopes also persist.
      # The PA API auto-creates parent directories on POST.
      # ------------------------------------------------------------------
      - name: Upload agent run JSON to PythonAnywhere
        if: always()
        env:
          PYTHONANYWHERE_TOKEN: ${{ secrets.PYTHONANYWHERE_TOKEN }}
          PYTHONANYWHERE_USERNAME: ${{ secrets.PYTHONANYWHERE_USERNAME }}
        run: |
          python - <<'PYEOF'
          import datetime
          import os
          import sys

          import requests

          token    = os.environ["PYTHONANYWHERE_TOKEN"]
          username = os.environ["PYTHONANYWHERE_USERNAME"]
          run_date = datetime.datetime.now(datetime.timezone.utc).date().isoformat()
          local    = os.path.join("data", "agent_runs", f"{run_date}.json")
          remote   = f"/home/{username}/finance_bot/data/agent_runs/{run_date}.json"

          if not os.path.exists(local):
              print(f"[WARN] {local} not found — agent never wrote a file.")
              print("[WARN] Skipping upload. The agent step likely failed before write.")
              sys.exit(0)

          url = f"https://www.pythonanywhere.com/api/v0/user/{username}/files/path{remote}"

          try:
              with open(local, "rb") as fh:
                  resp = requests.post(
                      url,
                      headers={"Authorization": f"Token {token}"},
                      files={"content": fh},
                      timeout=60,
                  )
          except requests.exceptions.RequestException as exc:
              print(f"[ERROR] Upload request failed: {exc}")
              sys.exit(1)

          if resp.status_code in (200, 201):
              print(f"[OK] Uploaded {local} → {remote}")
          else:
              print(f"[ERROR] Upload failed — HTTP {resp.status_code}: {resp.text.strip()}")
              sys.exit(1)
          PYEOF

      # ------------------------------------------------------------------
      # Re-raise the agent's exit code so the workflow shows red on
      # failure, even though we used continue-on-error to let the upload
      # step run.
      # ------------------------------------------------------------------
      - name: Report agent exit status
        if: always()
        run: |
          if [ "${{ steps.agent_run.outcome }}" = "failure" ]; then
            echo "Agent run reported failure"
            exit 1
          fi
