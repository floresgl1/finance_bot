name: Daily Agent Run

on:
  schedule:
    - cron: '30 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent-daily
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run agent
        id: agent_run
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python agent_main.py

      - name: Commit agent run artifact
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/agent_runs/
          if git diff --staged --quiet; then
            echo "No new agent run files to commit"
          else
            RUN_DATE=$(date -u +%Y-%m-%d)
            git commit -m "chore(agent): daily run ${RUN_DATE}"
            git push
          fi

      - name: Report agent exit status
        if: always()
        run: |
          if [ "${{ steps.agent_run.outcome }}" = "failure" ]; then
            echo "Agent run reported failure"
            exit 1
          fi
